name: ci

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/ec261.test.js test/more.test.js test/appr.test.js test/watcher.test.js test/clients.test.js test/ingest.test.js test/fuzz.test.js test/server.test.js
